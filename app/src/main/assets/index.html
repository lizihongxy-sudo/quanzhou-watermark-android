<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>泉州东站水印</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fa;margin:0;color:#17243b}header{background:#152f56;color:white;padding:24px 18px 18px}header h2{margin:0 0 6px}header small{color:#c7d8ed}.content{padding:14px;max-width:650px;margin:auto}.card{background:white;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 4px 20px #1739690d}label{font-size:13px;color:#607089;display:block;margin:12px 0 5px}input{font-size:16px;width:100%;padding:12px;border:1px solid #d9e1eb;border-radius:10px;background:white;color:#16233a}button,.btn{border:0;background:#185ac8;color:white;font-size:15px;font-weight:600;border-radius:12px;padding:13px;display:inline-block;text-align:center}.btn{position:relative;width:100%;overflow:hidden}.btn input{position:absolute;inset:0;opacity:0}.secondary{background:#e8effa;color:#2056a1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos{display:flex;gap:8px;overflow:auto;margin-top:12px}.thumb{position:relative;min-width:72px;height:78px;border-radius:11px;border:3px solid transparent;overflow:hidden;padding:0;background:#eef2f7}.thumb.sel{border-color:#2672e8}.thumb img{width:100%;height:100%;object-fit:cover}#preview{max-width:100%;border-radius:12px;background:#1a2b48;display:block;margin:auto}#status{font-size:12px;color:#758399;min-height:20px}.note{font-size:12px;color:#667b97;line-height:1.7}footer{text-align:center;padding:9px;color:#8492a7;font-size:11px}</style></head><body>
<header><h2>泉州东站 · 批量水印</h2><small>多图独立编辑日期时间｜天气自动查询｜一键批量保存</small></header><div class="content">
<div class="card"><label class="btn">＋ 从手机相册选择照片<input type="file" id="files" accept="image/*" multiple></label><div class="photos" id="photos"></div><p id="count" class="note">尚未导入图片</p></div>
<div class="card"><canvas id="preview"></canvas><p class="note">固定地点：泉州市惠安县 · 泉州东站<br>图片会添加“后期编辑”标识，修改的信息不代表原始相机记录。</p></div>
<div class="card"><div class="grid"><div><label>拍摄日期（编辑）</label><input id="date" type="date"></div><div><label>时间（编辑）</label><input id="time" type="time"></div></div><p id="weekday" class="note"></p><div class="grid"><button class="secondary" id="minus">－15 分钟</button><button class="secondary" id="plus">＋15 分钟</button></div><label>天气（自动获取，可手动改）</label><div class="grid"><input id="weather" placeholder="晴/阴/多云"><input id="temp" type="number" placeholder="温度 ℃"></div><div class="grid" style="margin-top:10px"><button class="secondary" id="weatherbtn">查询所选日期天气</button><button class="secondary" id="apply">应用到全部图片</button></div><label>水印大小</label><input id="scale" type="range" min="60" max="150" value="100"><p id="status"></p></div>
<div class="card"><button id="export" style="width:100%">一键导出全部照片 JPG</button><p class="note">导出照片保存到手机“下载 / 泉州东站水印”。大量高清照片可能需要逐张处理。</p></div></div><footer>泉州东站水印编辑器 V3 · 图片后期处理工具</footer>
<script>
const $=id=>document.getElementById(id),items=[];let active=-1;let size=100;
const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'],loc='泉州市惠安县 · 泉州东站';
const two=n=>String(n).padStart(2,'0');
const now=new Date(),initialDate=now.getFullYear()+'-'+two(now.getMonth()+1)+'-'+two(now.getDate()),initialTime=two(now.getHours())+':'+two(now.getMinutes());
function cdate(x){return new Date(x+'T12:00:00').getDay()}
function applyForm(){if(active<0)return;const p=items[active];p.date=$('date').value;p.time=$('time').value;p.weather=$('weather').value;p.temp=$('temp').value;update()}
function select(i){active=i;const p=items[i];$('date').value=p.date;$('time').value=p.time;$('weather').value=p.weather;$('temp').value=p.temp;update()}
function update(){ $('count').textContent=items.length?'共 '+items.length+' 张照片｜当前第 '+(active+1)+' 张':'尚未导入图片';$('weekday').textContent=$('date').value?wd[cdate($('date').value)]:'';const bar=$('photos');bar.innerHTML='';items.forEach((p,i)=>{let b=document.createElement('button');b.className='thumb '+(i===active?'sel':'');const im=new Image();im.src=p.url;b.append(im);b.onclick=()=>select(i);bar.append(b)});if(active>=0)draw(items[active],$('preview'),true)}
$('files').onchange=async e=>{const fs=Array.from(e.target.files);for(const f of fs){const url=URL.createObjectURL(f);const im=new Image();im.src=url;try{await im.decode()}catch{continue}items.push({url,img:im,date:initialDate,time:initialTime,weather:'',temp:'',name:f.name})}if(items.length)select(items.length-fs.length>=0?Math.max(0,items.length-fs.length):0);$('status').textContent='照片已导入';};
['date','time','weather','temp'].forEach(id=>$(id).oninput=applyForm);
$('scale').oninput=e=>{size=+e.target.value;update()};
function shift(m){if(active<0)return;const v=new Date($('date').value+'T'+$('time').value+':00');v.setMinutes(v.getMinutes()+m);$('date').value=v.getFullYear()+'-'+two(v.getMonth()+1)+'-'+two(v.getDate());$('time').value=two(v.getHours())+':'+two(v.getMinutes());applyForm()}
$('minus').onclick=()=>shift(-15);$('plus').onclick=()=>shift(15);
$('apply').onclick=()=>{if(active<0)return;const p=items[active];items.forEach(t=>{t.date=p.date;t.time=p.time;t.weather=p.weather;t.temp=p.temp});update();$('status').textContent='已应用到所有图片'};
function desc(code){if(code===0)return'晴';if(code<=3)return'多云';if(code<=48)return'雾';if(code<=67)return'雨';if(code<=77)return'雪';if(code<=82)return'阵雨';return'雷雨'}
async function getWeather(p){const stamp=p.date+'T'+p.time.slice(0,2)+':00';const hist=p.date<initialDate;const host=hist?'https://archive-api.open-meteo.com/v1/archive':'https://api.open-meteo.com/v1/forecast';const params=new URLSearchParams({latitude:'25.14',longitude:'118.72',start_date:p.date,end_date:p.date,hourly:'temperature_2m,weather_code',timezone:'Asia/Shanghai'});const response=await fetch(host+'?'+params);if(!response.ok)throw Error('天气接口 '+response.status);const d=await response.json(),j=d.hourly.time.indexOf(stamp);if(j<0||d.hourly.temperature_2m[j]===null)throw Error('选定时段暂无天气数据');p.weather=desc(d.hourly.weather_code[j]);p.temp=Math.round(d.hourly.temperature_2m[j]);}
$('weatherbtn').onclick=async()=>{if(active<0)return;$('status').textContent='正在查询天气…';try{await getWeather(items[active]);select(active);$('status').textContent='已按泉州东站附近位置匹配天气（模型数据）'}catch(e){$('status').textContent='天气获取失败：'+e.message+'，可手动填写'}};
function draw(p,canvas,preview){const w=p.img.naturalWidth,h=p.img.naturalHeight,ratio=preview?Math.min(1,650/w):1;canvas.width=Math.max(1,Math.round(w*ratio));canvas.height=Math.max(1,Math.round(h*ratio));if(preview)canvas.style.width='100%';const ctx=canvas.getContext('2d');ctx.drawImage(p.img,0,0,canvas.width,canvas.height);const k=canvas.width/1400*size/100,px=n=>n*k;ctx.save();ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=px(8);const y=canvas.height-px(135);const tm=p.time||'00:00';ctx.fillStyle='white';ctx.font='600 '+px(88)+'px Arial,sans-serif';ctx.fillText(tm,px(22),y);const mw=ctx.measureText(tm).width;ctx.fillStyle='#ffc630';ctx.fillRect(px(25)+mw,y-px(43),px(6),px(100));ctx.fillStyle='white';ctx.font=px(38)+'px Arial,sans-serif';const x=px(50)+mw;ctx.fillText(p.date||'',x,y-px(17));ctx.font=px(31)+'px Arial,sans-serif';ctx.fillText(wd[cdate(p.date)]+' '+(p.weather||'天气未填')+' '+(p.temp!==''?p.temp+'°C':''),x,y+px(30));ctx.font=px(29)+'px Arial,sans-serif';ctx.fillText(loc,px(25),canvas.height-px(35));ctx.textAlign='right';ctx.font=px(21)+'px Arial,sans-serif';ctx.fillText('照片后期编辑 · 非原始相机记录',canvas.width-px(20),canvas.height-px(28));ctx.restore()}
function save(name,mime,uri){const b64=uri.split(',')[1];if(window.AndroidSave){window.AndroidSave.save(name,mime,b64)}else{const a=document.createElement('a');a.href=uri;a.download=name;document.body.append(a);a.click();a.remove()}}
$('export').onclick=async()=>{if(!items.length){$('status').textContent='请先导入照片';return}const b=$('export');b.disabled=true;for(let i=0;i<items.length;i++){const p=items[i];$('status').textContent='导出 '+(i+1)+'/'+items.length;const c=document.createElement('canvas');draw(p,c,false);const data=c.toDataURL('image/jpeg',0.92);save('泉州东站_'+p.date+'_'+p.time.replace(':','')+'_'+two(i+1)+'.jpg','image/jpeg',data);await new Promise(r=>setTimeout(r,80))}b.disabled=false;$('status').textContent='已提交 '+items.length+' 张照片保存任务'};
</script></body></html>
